name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  admin-web:
    name: Admin Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Install Admin Web Dependencies
        run: npm ci

      - name: Typecheck Admin Web
        run: npm run typecheck

      - name: Integration Tests (Emulator)
        env:
          GCP_PROJECT_ID: demo-ai-chat
        run: npm run test:integration:emulator

  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Flutter Project
        run: flutter analyze
